name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giải nén dự án
        run: unzip -q twc-watchface-loader.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Kiểm thử lõi giao thức
        working-directory: twc-watchface-loader
        run: bash tests/run.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK debug
        working-directory: twc-watchface-loader
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TWC-Watchface-Loader-debug-apk
          path: twc-watchface-loader/app/build/outputs/apk/debug/app-debug.apk
