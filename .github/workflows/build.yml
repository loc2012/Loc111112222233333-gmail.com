name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tìm thư mục dự án
        id: p
        run: |
          f=$(find . -name settings.gradle.kts | head -1)
          if [ -z "$f" ]; then
            echo "KHÔNG thấy settings.gradle.kts trong repo. Các file hiện có:"
            find . -not -path './.git/*' -type f | head -50
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Chấp nhận license Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Đổi tên APK
        run: cp "${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" TWC-Watchface-Loader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TWC-Watchface-Loader-apk
          path: TWC-Watchface-Loader.apk

      - name: Đăng lên Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TWC Watchface Loader (bản mới nhất)
          files: TWC-Watchface-Loader.apk
