name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Chấp nhận license Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Đổi tên APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TWC-Watchface-Loader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TWC-Watchface-Loader-apk
          path: TWC-Watchface-Loader.apk

      - name: Đăng lên Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TWC Watchface Loader (bản mới nhất)
          files: TWC-Watchface-Loader.apk
